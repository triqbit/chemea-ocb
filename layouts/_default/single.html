{{ define "main" }}
<article class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <header class="mb-12">
    <h1 class="font-serif text-4xl font-bold mb-4">{{ .Title }}</h1>
    {{ if eq .Type "blog" }}
    <p class="text-slate-400">{{ .Date.Format "January 2, 2006" }} · {{ .ReadingTime }} min read</p>
    {{ end }}
  </header>

  <div class="prose prose-invert max-w-none mb-12">
    {{ .Content }}
  </div>

  {{ if eq .Type "blog" }}
  <footer class="border-t border-slate-700 pt-8">
    <p class="text-slate-400">Have questions? <a href="/contact/" class="text-teal hover:text-gold">Get in touch</a></p>
  </footer>
  {{ end }}
</article>
{{ end }}
