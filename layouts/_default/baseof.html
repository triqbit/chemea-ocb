<!doctype html>
<html lang="{{ .Site.Language.Lang }}" class="scroll-smooth">
<head>
  {{ partial "head.html" . }}
</head>
<body class="bg-slate-950 text-slate-50 font-sans">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-0 focus:left-0 focus:z-50 focus:p-4 focus:bg-teal focus:text-carbon">Skip to main content</a>
  
  {{ partial "header.html" . }}
  
  <main id="main" class="min-h-screen flex-grow">
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "footer.html" . }}
</body>
</html>
