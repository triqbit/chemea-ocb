{{ if eq .Type "faq" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What distinguishes carbon black from charcoal?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Carbon black is an engineered industrial material produced by controlled, incomplete combustion or thermal decomposition of hydrocarbon feedstocks, designed for reinforcement and pigmentation. Charcoal is typically produced from biomass or coal and optimized for fuel or adsorption rather than mechanical reinforcement."
      }
    },
    {
      "@type": "Question",
      "name": "Is OCB a manufacturer?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Chemea™ Oman Carbon Black (OCB) is a trading organization, coordinating supply, documentation, and logistics for carbon black grades produced by qualified third-party manufacturers. All product specifications, SDS, CoA, and regulatory statements originate from those producers."
      }
    },
    {
      "@type": "Question",
      "name": "What documentation is available?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For supplied grades, OCB can coordinate Safety Data Sheets (SDS) from the relevant producer, batch Certificates of Analysis (CoA) summarizing key test results, and producer regulatory/compliance information where available, such as chemical inventory status or regional declarations."
      }
    },
    {
      "@type": "Question",
      "name": "What is the shelf life of carbon black?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ASTM D8043 defines carbon black as having an indefinite shelf life when stored to protect it from liquid water and high humidity. Key physical characteristics such as particle size and structure are not expected to degrade with time. Store in dry, covered conditions away from liquid water or prolonged high humidity."
      }
    },
    {
      "@type": "Question",
      "name": "What information should be included in an RFQ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Include at minimum: intended application, target grade or reference standard if known, quantity and expected frequency, packaging preference, destination, preferred Incoterms, required delivery timeline, and documentation and compliance needs such as SDS, CoA, regulatory statements, and specific standards to reference."
      }
    }
  ]
}
</script>
{{ end }}
